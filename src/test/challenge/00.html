    <!-- Main Content Area -->
    <main class="pt-16 md:pt-0 min-h-screen flex items-center justify-center p-md md:p-lg pb-24 md:pb-lg">
        <!-- Challenge Invitation Card -->
        <div class="relative z-10 w-full max-w-md bg-[#18181b] border border-[#27272a] rounded-lg shadow-[0_8px_30px_rgb(0,0,0,0.5)] overflow-hidden flex flex-col transform transition-all hover:scale-[1.01] duration-300">
            <!-- Card Header / Title -->
            <div
                class="p-lg text-center border-b border-[#27272a] bg-surface-container-low/50 relative overflow-hidden">
                <!-- Subtle pattern overlay -->
                <div
                    class="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]">
                </div>
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-highest border border-outline-variant mb-sm">
                    <span class="material-symbols-outlined text-primary text-xl"
                        style="font-variation-settings: 'FILL' 1;">swords</span>
                </div>
                <h2 class="font-h3 text-h3 text-primary mb-xs">Challenge Request</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant">An opponent has invited you to a 1v1 match.
                </p>
            </div>
            <!-- Card Body -->
            <div class="p-lg flex flex-col gap-lg">
                <!-- Opponent Profile Area -->
                <div class="flex items-center gap-md p-md rounded-lg bg-surface-dim border border-[#27272a]">
                    <div class="w-14 h-14 rounded-full border-2 border-[#27272a] overflow-hidden shrink-0 relative">
                        <img alt="Vikram Singh Avatar" class="w-full h-full object-cover"
                            data-alt="A striking portrait of a competitive student named Vikram Singh. Dramatic studio lighting with deep shadows and crisp highlights. Shot against a dark, textured gray background. The subject looks determined, lit with cool, desaturated tones matching a modern UI dark theme aesthetic."
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6FeL0sCwC-1pGrX8O76WMZ34WNIsOdbRy1RH1iuPKyY5XuNy8TNHkqM86i2bO7pi8td8UMJOmQIKx_8CSuQPPccZputVXHC6i84CMofy_w-gRMd71YpIwTQej3ObrNKjCjSQjBL0WYh2JDAQwaaef-vhL6pycrPOvDAjwQHtcVwzwihZiCwsyKf5o4j90LZ4YA8RgahJWKRnas9hJjh5UhYBePZsecGR7UXoIzWPUH41TYXC_XcVe">
                        <!-- Online indicator -->
                        <div
                            class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-surface-dim">
                        </div>
                    </div>
                    <div class="flex-grow">
                        <h3 class="font-label-md text-label-md text-primary font-bold">Vikram Singh</h3>
                        <div class="flex items-center gap-sm mt-xs">
                            <span
                                class="inline-flex items-center px-2 py-0.5 rounded bg-surface-container-high border border-outline-variant/30 font-label-sm text-[10px] text-on-surface-variant uppercase tracking-wider">
                                Top 2%
                            </span>
                            <span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
                                <span class="material-symbols-outlined text-[14px]">military_tech</span> 72% Win Rate
                            </span>
                        </div>
                    </div>
                </div>
                <!-- Match Details -->
                <div class="grid grid-cols-2 gap-sm">
                    <div class="col-span-2 p-md rounded border border-[#27272a] bg-[#09090b]/50">
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">
                            Subject</p>
                        <p class="font-body-md text-body-md text-primary">Mathematics - Integration</p>
                    </div>
                    <div class="p-md rounded border border-[#27272a] bg-[#09090b]/50">
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">
                            Exam</p>
                        <p class="font-body-sm text-body-sm text-primary">JEE Advanced</p>
                    </div>
                    <div class="p-md rounded border border-[#27272a] bg-[#09090b]/50">
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">
                            Format</p>
                        <p class="font-body-sm text-body-sm text-primary">15 Qs / 20 Min</p>
                    </div>
                </div>
                <!-- Motivational Quote -->
                <div class="text-center pt-sm">
                    <p class="font-body-sm text-body-sm italic text-on-surface-variant/70">"Your only limit is you."</p>
                </div>
            </div>
            <!-- Card Actions -->
            <div class="px-lg pb-md flex items-center justify-between animate-pulse">
                <div class="flex items-center gap-sm">
                    <span class="relative flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="font-label-md text-label-md text-on-surface-variant">Waiting for Opponent...</span>
                </div>
                <div class="text-on-surface-variant/70 font-label-sm text-label-sm">00:45</div>
            </div>
            <div class="p-lg pt-0 flex flex-col gap-sm">
                <button
                    class="w-full h-12 rounded flex items-center justify-center gap-sm bg-primary text-[#09090b] font-label-md text-label-md font-bold hover:bg-surface-tint transition-all duration-150 active:scale-[0.98]">
                    <span class="material-symbols-outlined text-[18px]">check</span>
                    Accept Challenge
                </button>
                <button
                    class="w-full h-12 rounded flex items-center justify-center gap-sm bg-transparent border border-[#27272a] text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all duration-150 active:scale-[0.98]">
                    Decline
                </button>
            </div>
            <!-- Progress bar indicating time to accept (decorative) -->
            <div class="h-1 w-full bg-surface-container-high">
                <div class="h-full bg-primary w-full origin-left animate-[shrink_30s_linear_forwards]"></div>
            </div>
        </div>
    </main>

    <style>
        @keyframes shrink {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }
    </style>
